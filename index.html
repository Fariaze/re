<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(31, 40, 51, 0.8);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #45f3ff;
        }
        img {
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        h1 {
            font-size: 28px;
            color: #45f3ff;
            margin: 0 0 10px 0;
        }
        p {
            font-size: 18px;
            margin: 5px 0;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #66fcf1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ссылка на ваш логотип из репозитория -->
        <img src="pgrplogo.jpg" alt="Logo">
        
        <h1>Добро пожаловать на сервер!</h1>
        <p>Идет загрузка ресурсов, пожалуйста, подождите...</p>
        
        <!-- Замените текст ниже на адрес вашего сайта -->
        <div class="footer">Наш сайт: ://your-website.com</div>
    </div>

</body>
</html>
